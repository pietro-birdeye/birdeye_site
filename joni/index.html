<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joni Sandbox</title>
    <link rel="stylesheet" href="/src/pages/Homepage_00/style.css" />
    <link rel="stylesheet" href="/src/pages/Homepage_00/homepage.css" />
  </head>
  <body>
    <div data-global-nav></div>
    <div class="section-name" data-section-name="Hero block">
      <div class="stage stage-hero">
        <div class="grid grid-horizontal" style="background: transparent;">
          <div class="ablock" style="background: transparent; color: var(--color-system-black, #0a0a0a);">
            <div class="css-4i06av">
              <h1 class="bannerHeading display-hero">#1 Agentic Marketing Platform for Multi-location Brands</h1>
              <p class="bannerDescription body-xxl">
                Where AI agents build your online presence, manage your reputation, elevate your brand, and accelerate
                growth.
              </p>
              <div class="emailFormWrapper">
                <div class="input-group">
                  <input
                    required
                    type="email"
                    name="emailId"
                    autocomplete="off"
                    class="input body-l"
                  />
                  <label class="user-label">Enter your business email</label>
                </div>
                <div class="HeroCTAs">
                  <button
                    type="button"
                    data-clicktag="hero_watchdemo_lead_button"
                    class="diet-btn-txt"
                    data-size="lg"
                    data-variant="line1"
                  >
                    <span class="diet-btn-txt__label">Watch Demo</span>
                  </button>
                  <button
                    type="button"
                    data-clicktag="hero_seepricing_lead_button"
                    class="diet-btn-txt"
                    data-size="lg"
                    data-variant="primary"
                  >
                    <span class="diet-btn-txt__label">See Pricing</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="bblock">
            <div class="g2-title">
              <img class="g2-logo" src="about:blank" data-g2-logo alt="G2 logo" loading="lazy" />
              <div class="g2-title__rank heading-6">#1 in Online reputation management</div>
            </div>
            <div class="bblock-g2-hero" aria-label="G2 grid highlighting Birdeye">
              <img class="g2-base" data-g2-base="Base.svg" alt="" loading="lazy" />
              <div class="g2-overlays" aria-live="polite">
                <div class="g2-overlay" data-g2-overlay="01">
                  <img class="g2-overlay__image" data-g2-overlay-img alt="" loading="lazy" />
                  <img class="g2-overlay__logo" data-g2-overlay-logo alt="" loading="lazy" />
                </div>
                <div class="g2-overlay" data-g2-overlay="02">
                  <img class="g2-overlay__image" data-g2-overlay-img alt="" loading="lazy" />
                  <img class="g2-overlay__logo" data-g2-overlay-logo alt="" loading="lazy" />
                </div>
                <div class="g2-overlay" data-g2-overlay="03">
                  <img class="g2-overlay__image" data-g2-overlay-img alt="" loading="lazy" />
                  <img class="g2-overlay__logo" data-g2-overlay-logo alt="" loading="lazy" />
                </div>
              </div>
            </div>
            <div class="g2-pagination" aria-hidden="true">
              <span class="g2-page is-active" data-g2-page="0"></span>
              <span class="g2-page" data-g2-page="1"></span>
              <span class="g2-page" data-g2-page="2"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main values section (injected) -->
    <div data-main-values></div>

    <!-- Product block (injected) -->
    <div data-product-block></div>

    <!-- Brand carousel (injected) -->
    <div data-brand-carousel></div>

    <!-- Split block (injected) -->
    <div data-split-block></div>

    <!-- Industries block section -->
    <div data-industries></div>

    <!-- AI Stack section -->
    <div data-ai-stack></div>

    <!-- Customer results (injected) -->
    <div data-customer-results></div>


    <div class="section-name" data-section-name="Footer">
      <div class="stage">
        <div class="grid">
          <div data-footer></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/pages/Homepage_00/script.ts"></script>
  </body>
</html>
