<section data-section-name="Horizontal slider" class="new-carousel" data-horizontal-slider>
  <div class="brand-carousel__header block">
    <h2 class="display-h2">Horizontal slider</h2>
    <div class="brand-carousel__controls">
      <button class="diet-btn-ic" data-size="lg" data-variant="secondary" type="button" aria-label="Previous" data-horizontal-prev>
        <span class="diet-btn-ic__icon" data-icon="arrow.left"></span>
      </button>
      <button class="diet-btn-ic" data-size="lg" data-variant="secondary" type="button" aria-label="Next" data-horizontal-next>
        <span class="diet-btn-ic__icon" data-icon="arrow.right"></span>
      </button>
    </div>
  </div>

  <div class="new-carousel__viewport">
    <div class="new-carousel__scroller" data-horizontal-scroller>
      <div class="new-carousel__track" data-horizontal-track role="list">
        <article class="new-carousel__card horizontal-slider-card" role="listitem" tabindex="0">
          <div class="horizontal-slider-card__body"></div>
        </article>
        <article class="new-carousel__card horizontal-slider-card" role="listitem" tabindex="0">
          <div class="horizontal-slider-card__body"></div>
        </article>
        <article class="new-carousel__card horizontal-slider-card" role="listitem" tabindex="0">
          <div class="horizontal-slider-card__body"></div>
        </article>
        <article class="new-carousel__card horizontal-slider-card" role="listitem" tabindex="0">
          <div class="horizontal-slider-card__body"></div>
        </article>
        <article class="new-carousel__card horizontal-slider-card" role="listitem" tabindex="0">
          <div class="horizontal-slider-card__body"></div>
        </article>
        <article class="new-carousel__card horizontal-slider-card" role="listitem" tabindex="0">
          <div class="horizontal-slider-card__body"></div>
        </article>
        <article class="new-carousel__card horizontal-slider-card" role="listitem" tabindex="0">
          <div class="horizontal-slider-card__body"></div>
        </article>
        <article class="new-carousel__card horizontal-slider-card" role="listitem" tabindex="0">
          <div class="horizontal-slider-card__body"></div>
        </article>
      </div>
    </div>
  </div>

  <div class="new-carousel__controls new-carousel__controls--mobile">
    <button type="button" class="new-carousel__control" data-horizontal-prev aria-label="Previous slide">
      <span aria-hidden="true">◀</span>
    </button>
    <button type="button" class="new-carousel__control" data-horizontal-next aria-label="Next slide">
      <span aria-hidden="true">▶</span>
    </button>
  </div>
</section>
