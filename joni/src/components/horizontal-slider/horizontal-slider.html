<section data-section-name="Horizontal slider" data-horizontal-slider>
  <div class="stage">
    <div class="horizontal-slider">
      <div class="horizontal-slider__header block">
        <h2 class="display-h2">Horizontal slider</h2>
        <div class="horizontal-slider__controls horizontal-slider__controls--desktop">
          <button class="diet-btn-ic" data-size="lg" data-variant="secondary" type="button" aria-label="Previous" data-horizontal-prev>
            <span class="diet-btn-ic__icon" data-icon="arrow.left"></span>
          </button>
          <button class="diet-btn-ic" data-size="lg" data-variant="secondary" type="button" aria-label="Next" data-horizontal-next>
            <span class="diet-btn-ic__icon" data-icon="arrow.right"></span>
          </button>
        </div>
      </div>

      <div class="horizontal-slider__viewport">
        <div class="horizontal-slider__scroller" data-horizontal-scroller>
          <div class="horizontal-slider__track" data-horizontal-track role="list">
            <article class="horizontal-slider__card horizontal-slider-card" role="listitem" tabindex="0">
              <div class="horizontal-slider-card__body"></div>
            </article>
            <article class="horizontal-slider__card horizontal-slider-card" role="listitem" tabindex="0">
              <div class="horizontal-slider-card__body"></div>
            </article>
            <article class="horizontal-slider__card horizontal-slider-card" role="listitem" tabindex="0">
              <div class="horizontal-slider-card__body"></div>
            </article>
            <article class="horizontal-slider__card horizontal-slider-card" role="listitem" tabindex="0">
              <div class="horizontal-slider-card__body"></div>
            </article>
            <article class="horizontal-slider__card horizontal-slider-card" role="listitem" tabindex="0">
              <div class="horizontal-slider-card__body"></div>
            </article>
            <article class="horizontal-slider__card horizontal-slider-card" role="listitem" tabindex="0">
              <div class="horizontal-slider-card__body"></div>
            </article>
            <article class="horizontal-slider__card horizontal-slider-card" role="listitem" tabindex="0">
              <div class="horizontal-slider-card__body"></div>
            </article>
            <article class="horizontal-slider__card horizontal-slider-card" role="listitem" tabindex="0">
              <div class="horizontal-slider-card__body"></div>
            </article>
          </div>
        </div>
      </div>

      <div class="horizontal-slider__controls horizontal-slider__controls--mobile">
        <button type="button" class="horizontal-slider__control" data-horizontal-prev aria-label="Previous slide">
          <span aria-hidden="true">◀</span>
        </button>
        <button type="button" class="horizontal-slider__control" data-horizontal-next aria-label="Next slide">
          <span aria-hidden="true">▶</span>
        </button>
      </div>
    </div>
  </div>
</section>
