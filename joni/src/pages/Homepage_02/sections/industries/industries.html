<div class="section-name" data-section-name="Industries block">
  <div class="stage">
    <div class="block grid-vertical industries-block">
      <div class="section-header">
        <div class="section-header__row">
          <h2 class="display-h2">AI built for your industry and brand</h2>
          <button class="diet-btn-ictxt" data-size="lg" data-variant="neutral" type="button">
            <span class="diet-btn-ictxt__label">See all integrations</span>
            <span class="diet-btn-ictxt__icon" data-icon="arrow.up.right"></span>
          </button>
        </div>
      </div>
      <div class="industries-tabs">
        <div class="industries-block__tabs" role="tablist" aria-label="Industry Selection">
          <button class="industries-tab heading-5 is-active" type="button" aria-selected="true" data-industry="healthcare">Healthcare</button>
          <button class="industries-tab heading-5" type="button" aria-selected="false" data-industry="realestate">Real Estate</button>
          <button class="industries-tab heading-5" type="button" aria-selected="false" data-industry="finance">Finance</button>
          <button class="industries-tab heading-5" type="button" aria-selected="false" data-industry="self-storage">Self Storage</button>
          <button class="industries-tab heading-5" type="button" aria-selected="false" data-industry="dental">Dental</button>
          <button class="industries-tab heading-5" type="button" aria-selected="false" data-industry="restaurants">Restaurants</button>
          <button class="industries-tab heading-5" type="button" aria-selected="false" data-industry="legal">Legal</button>
          <button class="industries-tab heading-5" type="button" aria-selected="false" data-industry="auto">Auto</button>
          <button class="industries-tab heading-5" type="button" aria-selected="false" data-industry="retail">Retail</button>
        </div>
        <button class="industries-scroll industries-scroll--prev" type="button" aria-label="Scroll industries left" data-industries-prev>
          <img class="industries-scroll__icon" data-industries-prev-icon alt="" />
        </button>
        <button class="industries-scroll industries-scroll--next" type="button" aria-label="Scroll industries right" data-industries-next>
          <img class="industries-scroll__icon" data-industries-next-icon alt="" />
        </button>
      </div>
      <div class="industries-block__photo" data-industry-bg="industries_photos/healthcare.jpg">
        <figure class="industries-block__quote">
          <blockquote class="heading-3" data-industry-quote></blockquote>
          <p class="body-m" data-industry-quote-sub></p>
          <figcaption class="industries-block__cite">
            <div class="body-xl" data-industry-name></div>
            <div class="body-xxl body-s--muted" data-industry-company></div>
          </figcaption>
        </figure>
        <div class="industries-block__visual" data-industry-lottie></div>
      </div>
    </div>
  </div>
</div>
