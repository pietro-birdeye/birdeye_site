<!-- Main values section -->
<div class="section-name" data-section-name="Main values">
  <div class="stage">
    <div class="block grid-vertical brand-carousel">
      <div class="main-values-grid" role="list">
        <article class="brand-card" role="listitem">
          <a class="brand-card__link" href="#" aria-label="Square Register"></a>
          <div class="brand-card__media" data-animation="concentric">
            <div class="brand-card__animation" aria-hidden="true">
              <canvas class="brand-card__canvas"></canvas>
            </div>
          </div>
          <div class="brand-card__content">
            <div class="brand-card__title-row">
              <h3 class="heading-4">One platform</h3>
              <span class="brand-card__arrow" data-icon="arrow.up.right"></span>
            </div>
            <div class="brand-card__text">
              <p class="body-m">Replace your fragmented stack with a single enterprise platform.</p>
            </div>
          </div>
        </article>
        <article class="brand-card" role="listitem">
          <a class="brand-card__link" href="#" aria-label="Square Handheld"></a>
          <div class="brand-card__media" data-animation="radial">
            <div class="brand-card__animation" aria-hidden="true">
              <canvas class="brand-card__canvas"></canvas>
            </div>
          </div>
          <div class="brand-card__content">
            <div class="brand-card__title-row">
              <h3 class="heading-4">Unified data</h3>
              <span class="brand-card__arrow" data-icon="arrow.up.right"></span>
            </div>
            <div class="brand-card__text">
              <p class="body-m">Unify customer data across every location and signal.</p>
            </div>
          </div>
        </article>
        <article class="brand-card" role="listitem">
          <a class="brand-card__link" href="#" aria-label="Square Terminal"></a>
          <div class="brand-card__media" data-animation="sequential">
            <div class="brand-card__animation" aria-hidden="true">
              <canvas class="brand-card__canvas"></canvas>
            </div>
          </div>
          <div class="brand-card__content">
            <div class="brand-card__title-row">
              <h3 class="heading-4">Custom AI</h3>
              <span class="brand-card__arrow" data-icon="arrow.up.right"></span>
            </div>
            <div class="brand-card__text">
              <p class="body-m">Agents trained on your brand and industry to drive outcomes.</p>
            </div>
          </div>
        </article>
      </div>
    </div>
  </div>
</div>
