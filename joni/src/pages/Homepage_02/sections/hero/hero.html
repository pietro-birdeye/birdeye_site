<div class="section-name" data-section-name="Hero block">
  <div class="stage stage-hero">
    <video
      class="stage-hero__bg"
      data-hero-bg-video
      autoplay
      muted
      loop
      playsinline
      aria-hidden="true"
      preload="auto"
    ></video>
    <div class="block grid-horizontal" style="background: transparent;">
      <div class="ablock">
        <div class="css-4i06av">
          <h1 class="bannerHeading display-hero">#1 Agentic Marketing Platform for Multi-location Brands</h1>
          <p class="bannerDescription body-xxl">
            Where AI agents build your online presence, manage your reputation, elevate your brand, and accelerate
            growth.
          </p>
          <div class="emailFormWrapper">
            <div class="input-group">
              <input
                required
                type="email"
                name="emailId"
                autocomplete="off"
                class="input body-l"
              />
              <label class="user-label">Enter your business email</label>
            </div>
            <div class="HeroCTAs">
              <button
                type="button"
                data-clicktag="hero_watchdemo_lead_button"
                class="diet-btn-txt"
                data-size="lg"
                data-variant="line1"
              >
                <span class="diet-btn-txt__label">Watch Demo</span>
              </button>
              <button
                type="button"
                data-clicktag="hero_seepricing_lead_button"
                class="diet-btn-txt"
                data-size="lg"
                data-variant="primary"
              >
                <span class="diet-btn-txt__label">See Pricing</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="bblock">
        <div class="g2-title">
          <img class="g2-logo" data-g2-logo alt="G2 logo" loading="lazy" />
          <div class="g2-title__rank heading-6">#1 in Online reputation management</div>
        </div>
        <div class="bblock-g2-hero" aria-label="G2 grid highlighting Birdeye">
          <img class="g2-base" data-g2-base="Base.svg" alt="" loading="lazy" />
          <div class="g2-overlays" aria-live="polite">
            <div class="g2-overlay" data-g2-overlay="01">
              <img class="g2-overlay__image" data-g2-overlay-img alt="" loading="lazy" />
              <img class="g2-overlay__logo" data-g2-overlay-logo alt="" loading="lazy" />
            </div>
            <div class="g2-overlay" data-g2-overlay="02">
              <img class="g2-overlay__image" data-g2-overlay-img alt="" loading="lazy" />
              <img class="g2-overlay__logo" data-g2-overlay-logo alt="" loading="lazy" />
            </div>
            <div class="g2-overlay" data-g2-overlay="03">
              <img class="g2-overlay__image" data-g2-overlay-img alt="" loading="lazy" />
              <img class="g2-overlay__logo" data-g2-overlay-logo alt="" loading="lazy" />
            </div>
          </div>
        </div>
        <div class="g2-pagination" aria-hidden="true">
          <span class="g2-page is-active" data-g2-page="0"></span>
          <span class="g2-page" data-g2-page="1"></span>
          <span class="g2-page" data-g2-page="2"></span>
        </div>
      </div>
    </div>
