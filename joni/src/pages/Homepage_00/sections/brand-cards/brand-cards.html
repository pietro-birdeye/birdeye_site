<template data-brand-card-template>
  <div class="brand-card">
    <a class="brand-card__link" href="#" aria-label=""></a>
    <div class="brand-card__media">
      <img class="brand-card__image brand-card__image--default" data-brand-img="" alt="" />
      <img class="brand-card__image brand-card__image--hover" data-brand-hover="" alt="" aria-hidden="true" />
    </div>
    <div class="brand-card__content">
      <div class="brand-card__title-row">
        <div class="brand-card__logo-wrap">
          <img class="brand-card__logo" data-brand-logo="" alt="" />
        </div>
        <span class="brand-card__arrow" data-icon="arrow.up.right"></span>
      </div>
    </div>
  </div>
</template>
