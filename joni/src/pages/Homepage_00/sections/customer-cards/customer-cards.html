<template data-customer-card-template>
    <div class="customer-result-card" role="listitem" tabindex="0">
      <div class="customer-result-card__band">
        <div class="customer-result-card__stat">
          <div class="customer-result-card__value display-h2"></div>
          <div class="customer-result-card__label heading-5"></div>
        </div>
        <div class="customer-result-card__band-top">
          <div class="customer-result-card__logo-wrap">
            <img
              class="customer-result-card__logo"
              data-customer-logo=""
              alt=""
              loading="lazy"
              decoding="async"
            />
          </div>
          <span class="customer-result-card__arrow" data-icon="arrow.up.right" aria-hidden="true"></span>
        </div>
      </div>
    <p class="customer-result-card__quote body-xl">
      <span class="customer-result-card__highlight"></span>
      <span class="customer-result-card__quote-rest body-l"></span>
    </p>
    <div class="customer-result-card__meta">
      <div class="customer-result-card__name heading-6"></div>
      <div class="customer-result-card__title body-s"></div>
    </div>
  </div>
</template>
