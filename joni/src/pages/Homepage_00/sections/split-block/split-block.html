<!-- Split block section -->
<div class="section-name" data-section-name="Split block">
  <div class="stage" style="padding: 0;">
    <div class="grid split-block">
      <div class="split-block__content">
        <div class="header">
          <h2 class="display-h2">AI Agents built to deliver positive outcomes</h2>
        </div>
        <div class="split-block__list">
          <button class="split-block__item is-active" type="button" aria-expanded="true" data-split-img="01.jpg">
            <div class="split-block__item-head">
              <div class="split-block__item-title heading-5">Watch your brand rank #1 on AI and Google Search</div>
              <span class="split-block__item-toggle" aria-hidden="true">−</span>
            </div>
            <div class="split-block__panel">
              <div class="split-block__item-desc body-m">
                Sell anything in person and online with a point of sale platform that works for whatever you sell.
              </div>
              <a class="split-block__cta body-m" href="#">
                Learn more
                <span class="split-block__cta-icon" data-icon="arrow.up.right"></span>
              </a>
            </div>
            <div class="split-block__progress" aria-hidden="true"></div>
          </button>
          <button class="split-block__item" type="button" aria-expanded="false" data-split-img="team.png">
            <div class="split-block__item-head">
              <div class="split-block__item-title heading-5">Get a flawless reputation managed 24/7</div>
              <span class="split-block__item-toggle" aria-hidden="true">+</span>
            </div>
            <div class="split-block__panel">
              <div class="split-block__item-desc body-m">
                Run payroll, schedule shifts, and take care of admin — so your team can focus on performing their best.
              </div>
              <a class="split-block__cta body-m" href="#">
                Learn more
                <span class="split-block__cta-icon" data-icon="arrow.up.right"></span>
              </a>
            </div>
            <div class="split-block__progress" aria-hidden="true"></div>
          </button>
          <button class="split-block__item" type="button" aria-expanded="false" data-split-img="customers.png">
            <div class="split-block__item-head">
              <div class="split-block__item-title heading-5">Automate content and boost brand growth</div>
              <span class="split-block__item-toggle" aria-hidden="true">+</span>
            </div>
            <div class="split-block__panel">
              <div class="split-block__item-desc body-m">
                Set up the right marketing campaigns and loyalty program to welcome new customers and keep them coming back.
              </div>
              <a class="split-block__cta body-m" href="#">
                Learn more
                <span class="split-block__cta-icon" data-icon="arrow.up.right"></span>
              </a>
            </div>
            <div class="split-block__progress" aria-hidden="true"></div>
          </button>
          <button class="split-block__item" type="button" aria-expanded="false" data-split-img="banking.png">
            <div class="split-block__item-head">
              <div class="split-block__item-title heading-5">Take action on customer insights</div>
              <span class="split-block__item-toggle" aria-hidden="true">+</span>
            </div>
            <div class="split-block__panel">
              <div class="split-block__item-desc body-m">
                Bring your revenue under one roof. Instantly access your funds and get quicker access to loans.
              </div>
              <a class="split-block__cta body-m" href="#">
                Learn more
                <span class="split-block__cta-icon" data-icon="arrow.up.right"></span>
              </a>
            </div>
            <div class="split-block__progress" aria-hidden="true"></div>
          </button>
          <button class="split-block__item" type="button" aria-expanded="false" data-split-img="apps.png">
            <div class="split-block__item-head">
              <div class="split-block__item-title heading-5">Measure your performance by location</div>
              <span class="split-block__item-toggle" aria-hidden="true">+</span>
            </div>
            <div class="split-block__panel">
              <div class="split-block__item-desc body-m">
                Manage your entire business without jumping between tools by connecting hundreds of apps.
              </div>
              <a class="split-block__cta body-m" href="#">
                Learn more
                <span class="split-block__cta-icon" data-icon="arrow.up.right"></span>
              </a>
            </div>
            <div class="split-block__progress" aria-hidden="true"></div>
          </button>
        </div>
      </div>
      <div class="split-block__visual">
        <div class="split-block__lottie" data-split-lottie></div>
        <img data-split-hero alt="Point of sale visual" />
        <div class="split-block__overlay"></div>
      </div>
    </div>
  </div>
</div>
