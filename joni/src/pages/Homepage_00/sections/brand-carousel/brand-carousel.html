<!-- Brand carousel section -->
<div class="section-name" data-section-name="Brand carousel">

      <div class="brand-carousel__controls">

          <span class="diet-btn-ic__icon" data-icon="arrow.left"></span>
        </button>
        <button class="diet-btn-ic" data-size="lg" data-variant="secondary" type="button" data-brand-next aria-label="Next brand">

                  class="brand-card__image brand-card__image--default"
                  data-brand-img="Imgs/WYNDHAM.png"

                />
                <img
                  class="brand-card__image brand-card__image--hover"

                  aria-hidden="true"
                />
              </div>
              <div class="brand-card__content">

                    <img class="brand-card__logo" data-brand-logo="Logos/WYNDHAM_LOGO.svg" alt="Wyndham logo" />
