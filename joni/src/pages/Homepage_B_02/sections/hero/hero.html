<div class="section-name" data-section-name="Hero block">
  <div class="stage stage-hero">
    <div class="block grid-horizontal hero-block">
      <div class="hero-ablock">
        <h1 class="bannerHeading display-h2">
          #1 Agentic Marketing Platform<br />
          for Multi-location Brands
        </h1>
        <p class="bannerDescription body-xxl">
          Where AI agents build your online presence, manage your reputation, elevate your brand, and accelerate growth.
        </p>
        <div class="emailFormWrapper">
          <div class="input-group">
            <input required type="email" name="emailId" autocomplete="off" class="input body-l" />
            <label class="user-label">Enter your business email</label>
          </div>
          <div class="HeroCTAs">
            <button
              type="button"
              data-clicktag="hero_watchdemo_lead_button"
              class="diet-btn-txt"
              data-size="lg"
              data-variant="line1"
            >
              <span class="diet-btn-txt__label">Watch Demo</span>
            </button>
            <button
              type="button"
              data-clicktag="hero_seepricing_lead_button"
              class="diet-btn-txt"
              data-size="lg"
              data-variant="primary"
            >
              <span class="diet-btn-txt__label">See Pricing</span>
            </button>
          </div>
        </div>
      </div>
      <div class="hero-bblock">
        <div class="hero-bblock__media" data-hero-lottie aria-label="Customer results animation"></div>
      </div>
    </div>
  </div>
</div>
