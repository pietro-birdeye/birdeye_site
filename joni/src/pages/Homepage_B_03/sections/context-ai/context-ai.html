<div class="section-name" data-section-name="Context AI">
  <div class="stage stage-context-ai">
    <div class="block">
      <div class="grid context-ai">
        <div class="header product-block__header context-ai__header">
          <h1 class="display-h1">Context-aware AI for every location.</h1>
          <button class="diet-btn-ictxt" data-size="lg" data-variant="neutral" type="button">
            <span class="diet-btn-ictxt__label">Explore BirdAI</span>
            <span class="diet-btn-ictxt__icon" data-icon="arrow.up.right"></span>
          </button>
          <p class="body-l context-ai__subhead">
            Unify fragmented signals, apply brand voice and compliance guardrails, and let agents execute across your entire
            footprint.
          </p>
        </div>
        <div class="context-ai__a">
          <div class="context-ai__visual">
            <img data-context-ai-visual alt="" loading="lazy" />
          </div>
        </div>
        <div class="context-ai__b" role="list">
          <button
            class="context-ai__item is-active"
            type="button"
            role="listitem"
            aria-pressed="true"
              data-visual="imgs/library/ProductSnippets/Platform_Unified_signals.png"
              data-alt="Unified signals workflow"
            >
              <span class="heading-6">Unified signals</span>
            <span class="body-m">
              Bring customer, feedback, transaction, behavioral, and social data into a single, location-aware view—so
              agents act on the same source of truth.
            </span>
          </button>
          <button
            class="context-ai__item"
            type="button"
            role="listitem"
            aria-pressed="false"
              data-visual="imgs/library/ProductSnippets/Platform_Unified_signals.png"
              data-alt="Unified signals workflow"
            >
              <span class="heading-6">Brand voice, built in</span>
            <span class="body-m">
              Define tone and messaging once. Agents create and respond consistently across every channel and location.
            </span>
          </button>
          <button
            class="context-ai__item"
            type="button"
            role="listitem"
            aria-pressed="false"
              data-visual="imgs/library/ProductSnippets/Platform_Unified_signals.png"
              data-alt="Unified signals workflow"
            >
              <span class="heading-6">Compliance guardrails</span>
            <span class="body-m">
              Apply industry rules and policy constraints by configuration. Higher-risk cases are automatically restricted or
              escalated.
            </span>
          </button>
          <button
            class="context-ai__item"
            type="button"
            role="listitem"
            aria-pressed="false"
              data-visual="imgs/library/ProductSnippets/Platform_Unified_signals.png"
              data-alt="Unified signals workflow"
            >
              <span class="heading-6">Execution at footprint scale</span>
            <span class="body-m">
              Agents take action across listings, reviews, social, and insights—then measure performance by location, region,
              and brand.
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
