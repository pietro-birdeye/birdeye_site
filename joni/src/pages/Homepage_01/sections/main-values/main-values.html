<!-- Main values section -->
<div class="section-name" data-section-name="Main values">
  <div class="stage section-padding">
    <div class="block grid-vertical brand-carousel">
      <div class="main-values-grid" role="list">
        <article class="brand-card" role="listitem">
          <a class="brand-card__link" href="#" aria-label="Square Register"></a>
          <div class="brand-card__media" data-abstract-img="abstract01.jpg">
            <div class="brand-card__svg brand-card__svg--one-platform" aria-hidden="true">
              <div class="brand-card__initial" data-main-value-img="01.svg"></div>
              <svg id="onePlatformSvg" viewBox="0 0 200 200" role="presentation">
                <circle class="final-shape" cx="100" cy="100" r="40" />
              </svg>
            </div>
          </div>
          <div class="brand-card__content">
            <div class="brand-card__title-row">
              <h3 class="heading-2">One platform</h3>
              <span class="brand-card__arrow" data-icon="arrow.up.right"></span>
            </div>
            <div class="brand-card__text">
              <p class="body-m">Replace your fragmented stack with a single enterprise platform.</p>
            </div>
          </div>
        </article>
        <article class="brand-card" role="listitem">
          <a class="brand-card__link" href="#" aria-label="Square Handheld"></a>
          <div class="brand-card__media" data-abstract-img="abstract02.jpg">
            <div class="brand-card__svg brand-card__svg--unified" aria-hidden="true">
              <div class="brand-card__initial" data-main-value-img="02.svg"></div>
              <svg id="unifiedDataSvg" viewBox="0 0 200 200" role="presentation">
                <circle class="final-shape" cx="100" cy="100" r="40" />
              </svg>
            </div>
          </div>
          <div class="brand-card__content">
            <div class="brand-card__title-row">
              <h3 class="heading-2">Unified data</h3>
              <span class="brand-card__arrow" data-icon="arrow.up.right"></span>
            </div>
            <div class="brand-card__text">
              <p class="body-m">Unify customer data across every location and signal.</p>
            </div>
          </div>
        </article>
        <article class="brand-card" role="listitem">
          <a class="brand-card__link" href="#" aria-label="Square Terminal"></a>
          <div class="brand-card__media" data-abstract-img="abstract03.jpg">
            <div class="brand-card__svg brand-card__svg--custom" aria-hidden="true">
              <div class="brand-card__initial" data-main-value-img="03.svg"></div>
              <svg id="customAiSvg" viewBox="0 0 200 200" role="presentation">
                <circle class="final-shape" cx="100" cy="100" r="40" />
              </svg>
            </div>
          </div>
          <div class="brand-card__content">
            <div class="brand-card__title-row">
              <h3 class="heading-2">Custom AI</h3>
              <span class="brand-card__arrow" data-icon="arrow.up.right"></span>
            </div>
            <div class="brand-card__text">
              <p class="body-m">Agents trained on your brand and industry to drive outcomes.</p>
            </div>
          </div>
        </article>
      </div>
    </div>
  </div>
</div>
