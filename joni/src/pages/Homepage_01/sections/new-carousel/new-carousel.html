<section data-section-name="Business carousel">
  <div class="new-carousel" data-new-carousel>
    <div class="brand-carousel__header block">
      <h2 class="display-h2">Customer results</h2>
      <div class="brand-carousel__controls">
        <button class="diet-btn-ic" data-size="lg" data-variant="secondary" type="button" aria-label="Previous" data-new-carousel-prev>
          <span class="diet-btn-ic__icon" data-icon="arrow.left"></span>
        </button>
        <button class="diet-btn-ic" data-size="lg" data-variant="secondary" type="button" aria-label="Next" data-new-carousel-next>
          <span class="diet-btn-ic__icon" data-icon="arrow.right"></span>
        </button>
      </div>
    </div>

    <div class="new-carousel__viewport">
      <div class="new-carousel__scroller" data-new-carousel-wrapper>
        <div class="new-carousel__track" data-new-carousel-track></div>
      </div>
    </div>

    <div class="new-carousel__controls new-carousel__controls--mobile">
      <button type="button" class="new-carousel__control" data-new-carousel-prev aria-label="Previous slide">
        <span aria-hidden="true">◀</span>
      </button>
      <button type="button" class="new-carousel__control" data-new-carousel-next aria-label="Next slide">
        <span aria-hidden="true">▶</span>
      </button>
    </div>
  </div>
</section>
