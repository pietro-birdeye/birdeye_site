<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>AI Built for Your Industry and Brand</title>
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="dental" data-model-id="313:18603">
      <header class="frame">
        <section class="div">
          <div class="frame-2">
            <h1 class="text-wrapper">AI built for your industry and brand</h1>
            <a href="#integrations" class="secondary-CTA" role="button" aria-label="See all Integrations">
              <span class="see-all-industries">See all Integrations</span>
            </a>
          </div>
          <div class="div-wrapper">
            <p class="p">
              BirdAI is trained on your brand voice, industry, and context, so every AI Agent acts like a member of your
              team.
            </p>
          </div>
        </section>
      </header>
      <section class="frame-3">
        <nav class="segmented-control" role="tablist" aria-label="Industry Selection">
          <button class="active" role="tab" aria-selected="true" aria-controls="healthcare-panel" id="healthcare-tab">
            <span class="healtcare">Healthcare</span>
          </button>
          <button
            class="healtcare-wrapper"
            role="tab"
            aria-selected="false"
            aria-controls="realestate-panel"
            id="realestate-tab"
          >
            <span class="healtcare-2">Real Estate</span>
          </button>
          <button
            class="healtcare-wrapper"
            role="tab"
            aria-selected="false"
            aria-controls="finance-panel"
            id="finance-tab"
          >
            <span class="healtcare-2">Finance</span>
          </button>
          <button
            class="healtcare-wrapper"
            role="tab"
            aria-selected="false"
            aria-controls="selfstorage-panel"
            id="selfstorage-tab"
          >
            <span class="healtcare-2">Self Storage</span>
          </button>
          <button
            class="healtcare-wrapper"
            role="tab"
            aria-selected="false"
            aria-controls="dental-panel"
            id="dental-tab"
          >
            <span class="healtcare-2">Dental</span>
          </button>
          <button
            class="healtcare-wrapper"
            role="tab"
            aria-selected="false"
            aria-controls="restaurants-panel"
            id="restaurants-tab"
          >
            <span class="healtcare-2">Restaurants</span>
          </button>
          <button class="healtcare-wrapper" role="tab" aria-selected="false" aria-controls="legal-panel" id="legal-tab">
            <span class="healtcare-2">Legal</span>
          </button>
          <button class="healtcare-wrapper" role="tab" aria-selected="false" aria-controls="auto-panel" id="auto-tab">
            <span class="healtcare-2">Auto</span>
          </button>
          <button
            class="healtcare-wrapper"
            role="tab"
            aria-selected="false"
            aria-controls="retail-panel"
            id="retail-tab"
          >
            <span class="healtcare-2">Retail</span>
          </button>
        </nav>
        <article class="photo" role="tabpanel" id="healthcare-panel" aria-labelledby="healthcare-tab">
          <figure class="frame-4">
            <img class="image" src="img/image.svg" alt="Five star rating" />
            <blockquote class="the-best-review">
              <span class="span">The best review generation platform on the market! </span>
              <span class="text-wrapper-2"> </span>
              <span class="text-wrapper-3"
                >It uses cutting-edge AI to analyze customer sentiments, allowing for precise and insightful feedback. A
                five-star solution all the way!</span
              >
            </blockquote>
            <figcaption class="name-title">
              <cite class="full-name">Ken Norquist</cite>
              <span class="title-company">Axia Women's Health</span>
            </figcaption>
          </figure>
          <img class="img" src="img/frame-1410083112.svg" alt="Healthcare industry integrations visualization" />
        </article>
      </section>
    </main>
  </body>
</html>
